{% extends "base.html" %}
{% block title %}Login — PocketSmart AI{% endblock %}
{% block content %}
<div class="auth-card">
<h1>Welcome back</h1><p>Sign in to continue to your budget dashboard.</p>
<form id="loginForm">
<label>Email<input name="email" type="email" required></label>
<label>Password<input name="password" type="password" minlength="6" required></label>
<button class="btn primary" type="submit">Sign In</button>
<div id="message" class="message"></div>
</form>
<p>New here? <a href="/register">Create an account</a></p>
</div>
{% endblock %}
{% block scripts %}<script>
document.getElementById("loginForm").addEventListener("submit", async e => {
 e.preventDefault();
 const f = new FormData(e.target);
 const r = await fetch("/login", {
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(Object.fromEntries(f))
 });
 const d=await r.json();
 document.getElementById("message").textContent=d.detail||d.message;
 if(r.ok) location.href="/dashboard";
});
</script>{% endblock %}
